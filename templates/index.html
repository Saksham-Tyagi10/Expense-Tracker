<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light py-4">
  <div class="container">
    <!-- Navbar Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-0">Expense Tracker</h2>
        <small class="text-muted">Welcome, {{ username }}</small>
      </div>
      <button class="btn btn-outline-danger btn-sm" onclick="logoutUser()">Logout</button>
    </div>

    <!-- Summary Cards -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card text-center p-3 shadow-sm border-success">
          <h6 class="text-muted">Total Income</h6>
          <h3 id="total-income" class="text-success fw-bold">₹0.00</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center p-3 shadow-sm border-danger">
          <h6 class="text-muted">Total Expense</h6>
          <h3 id="total-expense" class="text-danger fw-bold">₹0.00</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center p-3 shadow-sm border-primary">
          <h6 class="text-muted">Net Balance</h6>
          <h3 id="net-balance" class="text-primary fw-bold">₹0.00</h3>
        </div>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="row g-4">
      <!-- Add Transaction Form -->
      <div class="col-lg-4">
        <div class="card shadow-sm p-4">
          <h5 class="mb-3">Add Transaction</h5>
          <form id="tx-form">
            <div class="mb-2">
              <label class="form-label">Type</label>
              <select id="tx-type" class="form-select" required>
                <option value="EXPENSE">Expense</option>
                <option value="INCOME">Income</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Category</label>
              <select id="tx-category" class="form-select" required></select>
            </div>
            <div class="mb-2">
              <label class="form-label">Amount (₹)</label>
              <input type="number" step="0.01" id="tx-amount" class="form-control" required placeholder="e.g. 500">
            </div>
            <div class="mb-2">
              <label class="form-label">Date</label>
              <input type="date" id="tx-date" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Payment Method</label>
              <select id="tx-method" class="form-select">
                <option value="UPI">UPI</option>
                <option value="Cash">Cash</option>
                <option value="Card">Card</option>
                <option value="Net Banking">Net Banking</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <input type="text" id="tx-desc" class="form-control" placeholder="Optional notes">
            </div>
            <button type="submit" class="btn btn-dark w-100">Save Transaction</button>
          </form>
        </div>
      </div>

      <!-- Chart & History -->
      <div class="col-lg-8">
        <div class="card shadow-sm p-3 mb-4">
          <h5 class="mb-3">Expense Breakdown</h5>
          <div style="max-height: 250px; display: flex; justify-content: center;">
            <canvas id="expenseChart"></canvas>
          </div>
        </div>

        <div class="card shadow-sm p-3">
          <h5 class="mb-3">Transaction History</h5>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Date</th>
                  <th>Category</th>
                  <th>Description</th>
                  <th>Method</th>
                  <th>Amount</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="tx-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
